<!DOCTYPE html>
<html lang="zh-CN">

<style>
  :root {
    --ink: #e8ecff;

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #04050e; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }
  #sky { position: fixed; inset: 0; display: block; touch-action: none; }

  .hud { position: fixed; z-index: 10; pointer-events: none; }
  .hud.top-left { top: 28px; left: 32px; }
  .hud.top-right { top: 28px; right: 32px; text-align: right; }
  .hud.bottom { bottom: 24px; left: 0; right: 0; text-align: center; }

  .title {
    font-size: 15px; letter-spacing: 0.42em; font-weight: 300;
    color: var(--dim); text-transform: uppercase;
  }
  .title b { color: var(--ink); font-weight: 500; }
  .subtitle {
    margin-top: 6px; font-size: 12px; letter-spacing: 0.18em;
    color: var(--faint);
  }
  .clock { font-size: 13px; letter-spacing: 0.2em; color: var(--dim); font-variant-numeric: tabular-nums; }
  .wishes { margin-top: 6px; font-size: 12px; letter-spacing: 0.15em; color: var(--faint); }
  .wishes em { font-style: normal; color: var(--accent); }

  .hint {
    display: inline-block; font-size: 12px; letter-spacing: 0.22em;
    color: var(--faint); padding: 10px 22px;
    border: 1px solid rgba(232, 236, 255, 0.08); border-radius: 999px;
    background: rgba(6, 8, 22, 0.35); backdrop-filter: blur(6px);
  }

  #tooltip {
    position: fixed; z-index: 20; pointer-events: none;
    padding: 10px 16px; border-radius: 10px;
    background: rgba(8, 11, 30, 0.82); backdrop-filter: blur(10px);
    border: 1px solid rgba(160, 180, 255, 0.18);
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 280px;
  }
  #tooltip.on { opacity: 1; transform: translateY(0); }
  #tooltip .t-name { font-size: 14px; letter-spacing: 0.08em; color: var(--ink); }
  #tooltip .t-name span { color: var(--dim); font-size: 11px; margin-left: 8px; letter-spacing: 0.15em; }
  #tooltip .t-star { font-size: 11px; color: var(--accent); margin-top: 3px; letter-spacing: 0.1em; }
  #tooltip .t-lore { font-size: 12px; color: var(--dim); margin-top: 5px; line-height: 1.6; }

  #toast {
    position: fixed; z-index: 20; top: 22%; left: 50%;
    transform: translateX(-50%); pointer-events: none;
    font-size: 14px; letter-spacing: 0.3em; color: var(--accent);
    text-shadow: 0 0 24px rgba(255, 217, 138, 0.6);
    opacity: 0; transition: opacity 1.2s ease;
  }
  #toast.on { opacity: 1; }

  #soundBtn {
    position: fixed; z-index: 30; bottom: 22px; right: 28px;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(232, 236, 255, 0.15);
    background: rgba(6, 8, 22, 0.5); color: var(--dim);
    cursor: pointer; font-size: 17px; line-height: 1;
    transition: all 0.3s ease; backdrop-filter: blur(6px);
  }
  #soundBtn:hover { color: var(--ink); border-color: rgba(232, 236, 255, 0.4); }
  #soundBtn.on { color: var(--accent); border-color: rgba(255, 217, 138, 0.5); box-shadow: 0 0 18px rgba(255, 217, 138, 0.25); }

    position: fixed; z-index: 30; bottom: 22px; right: 84px;
    height: 44px; padding: 0 18px; border-radius: 999px;
    border: 1px solid rgba(232, 236, 255, 0.15);
    background: rgba(6, 8, 22, 0.5); color: var(--dim);
    cursor: pointer; font-size: 13px; letter-spacing: 0.18em; line-height: 1;
    transition: all 0.3s ease; backdrop-filter: blur(6px);
    font-family: inherit;
  }
  #showerBtn:hover { color: var(--ink); border-color: rgba(232, 236, 255, 0.4); }

const canvas = document.getElementById("sky");

/* 有效渲染倍率 = 设备 DPR × 页面缩放（visualViewport.scale）。
   不再把 DPR 卡在 2：高分屏手机（DPR 2.75~3.5）原先直接丢失 30~50% 物理像素，
   捏合放大时浏览器拉伸低分位图导致光晕发糊——现在缩放变化会重建后备存储。
   性能护栏：后备存储宽度不超过 6000px，超限则等比降档。 */
function effectiveRatio() {
  const zoom = (window.visualViewport && window.visualViewport.scale) || 1;
  let ratio = (window.devicePixelRatio || 1) * zoom;
  const maxW = 6000;
  if (window.innerWidth * ratio > maxW) ratio = maxW / window.innerWidth;
  return Math.min(ratio, 4);
}

let W = 0, H = 0, RATIO = 1;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  RATIO = effectiveRatio();
  canvas.width = Math.round(W * RATIO);
  canvas.height = Math.round(H * RATIO);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(RATIO, 0, 0, RATIO, 0, 0);
}
window.addEventListener("resize", resize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
resize();

/* 缩放状态下 clientX/Y 相对视觉视口，需换算回布局视口坐标 */
function toLayout(x, y) {
  const vv = window.visualViewport;
  return vv ? { x: x + vv.offsetLeft, y: y + vv.offsetTop } : { x, y };
}

    r: layer < 0.6 ? rand(0.4, 0.9) : layer < 0.9 ? rand(0.9, 1.5) : rand(1.5, 2.3),
    layer: layer < 0.6 ? 0.3 : layer < 0.9 ? 0.6 : 1.0,
    tw: rand(0.5, 2.2), ph: rand(0, Math.PI * 2),

/* ---------- 银河带：贯穿天鹅—射手—天蝎的虚拟路径 + 星尘 ---------- */
/* 光带本体缓存在离屏 canvas（每帧 14 个大半径渐变在手机上太贵），
   只有星尘每帧重绘；缩放/resize 时置脏重建 */
const MW_PATH = [[1030,60],[960,140],[900,210],[826,330],[770,470],[712,595],[660,700],[600,860]];
const mwDust = [];
let mwLayer = null, mwLayerPad = 80;
(function genDust() {
  const segs = [];
  let total = 0;
  for (let i = 0; i < MW_PATH.length - 1; i++) {
    const [x1, y1] = MW_PATH[i], [x2, y2] = MW_PATH[i + 1];
    const len = Math.hypot(x2 - x1, y2 - y1);
    segs.push({ x1, y1, x2, y2, len });
    total += len;
  }
  for (let i = 0; i < 260; i++) {
    let d = Math.random() * total, seg = segs[0];
    for (const s of segs) { if (d <= s.len) { seg = s; break; } d -= s.len; }
    const t = Math.random();
    /* 垂直于路径方向的偏移，模拟银河的宽窄不均 */
    const nx = -(seg.y2 - seg.y1) / seg.len, ny = (seg.x2 - seg.x1) / seg.len;
    const off = (Math.random() + Math.random() + Math.random() - 1.5) * 46;
    mwDust.push({
      x: seg.x1 + (seg.x2 - seg.x1) * t + nx * off,
      y: seg.y1 + (seg.y2 - seg.y1) * t + ny * off,
      r: rand(0.3, 0.9), tw: rand(0.3, 1.2), ph: rand(0, Math.PI * 2),
    });
  }
})();

function buildMWLayer() {
  const PAD = mwLayerPad;
  const lw = W + PAD * 2, lh = H + PAD * 2;
  mwLayer = document.createElement("canvas");
  mwLayer._w = W; mwLayer._h = H; mwLayer._r = RATIO;
  mwLayer.width = Math.round(lw * RATIO);
  mwLayer.height = Math.round(lh * RATIO);
  const o = mwLayer.getContext("2d");
  o.setTransform(RATIO, 0, 0, RATIO, 0, 0);
  const scale = skyScale();
  const cx = lw / 2, cy = lh / 2;
  const R = Math.max(W, H) * 0.16;
  for (let i = 0; i < MW_PATH.length - 1; i++) {
    const vx = (MW_PATH[i][0] + MW_PATH[i + 1][0]) / 2;
    const vy = (MW_PATH[i][1] + MW_PATH[i + 1][1]) / 2;
    const px = cx + (vx - 500) * scale, py = cy + (vy - 400) * scale;
    const g = o.createRadialGradient(px, py, 0, px, py, R);
    g.addColorStop(0, "rgba(168, 185, 255, 0.05)");
    g.addColorStop(0.55, "rgba(150, 165, 235, 0.024)");
    g.addColorStop(1, "rgba(140, 155, 230, 0)");
    o.fillStyle = g;
    o.beginPath(); o.arc(px, py, R, 0, Math.PI * 2); o.fill();
  }
}

function drawMilkyWay() {
  if (!mwLayer || mwLayer._w !== W || mwLayer._h !== H || mwLayer._r !== RATIO) buildMWLayer();
  /* 光带随天球漂移/视差平移（缓存层不含运动，每帧只需一次 drawImage） */
  const dx = Math.sin(drift * 0.05) * 14 * 0.6 - ((mouse.x - W / 2) / W) * 34 * 0.6;
  const dy = Math.cos(drift * 0.037) * 8 * 0.6 - ((mouse.y - H / 2) / H) * 22 * 0.6;
  ctx.drawImage(mwLayer, dx - mwLayerPad, dy - mwLayerPad, W + mwLayerPad * 2, H + mwLayerPad * 2);
  /* 星尘 */
  ctx.fillStyle = "#cdd8ff";
  for (const d of mwDust) {
    const p = project(d.x, d.y, 0.6);
    if (p.x < -5 || p.x > W + 5 || p.y < -5 || p.y > H + 5) continue;
    ctx.globalAlpha = 0.12 + 0.1 * (Math.sin(drift * d.tw + d.ph) * 0.5 + 0.5);
    ctx.beginPath(); ctx.arc(p.x, p.y, d.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- 天体投影：虚拟坐标 → 屏幕（含缓慢天球漂移 + 视差） ---------- */
/* Pointer Events 统一鼠标/触摸/触控笔：手机拖动同样驱动视差 */
const mouse = { x: W / 2, y: H / 2, px: 0, py: 0 };
window.addEventListener("pointermove", e => {
  const p = toLayout(e.clientX, e.clientY);
  mouse.x = p.x; mouse.y = p.y;
}, { passive: true });

/* 触摸长按（480ms 不滑动）→ 固定显示该处星座提示 2.6 秒 */
let pinTimer = null, pinUntil = 0, pinHover = null;
window.addEventListener("pointerdown", e => {
  if (e.pointerType !== "touch") return;
  const p = toLayout(e.clientX, e.clientY);
  clearTimeout(pinTimer);
  pinTimer = setTimeout(() => {
    pinHover = findHover(p.x, p.y);
    pinUntil = performance.now() + 2600;
  }, 480);
}, { passive: true });
window.addEventListener("pointerup", () => clearTimeout(pinTimer), { passive: true });
window.addEventListener("pointercancel", () => clearTimeout(pinTimer), { passive: true });

let drift = 0;
function skyScale() {
  return Math.min(W / 1080, H / 860);
}
function project(vx, vy, layer) {
  const scale = skyScale();
  const driftX = Math.sin(drift * 0.05) * 14 * layer;
  const driftY = Math.cos(drift * 0.037) * 8 * layer;
  const px = (mouse.x - W / 2) / W, py = (mouse.y - H / 2) / H;
  return {
    x: W / 2 + (vx - 500) * scale + driftX - px * 34 * layer,
    y: H / 2 + (vy - 400) * scale + driftY - py * 22 * layer,
  };
}
/* 屏幕坐标 → 虚拟天球（project 的近似逆变换，忽略漂移/视差——量级 10~20px，可接受） */
function unproject(x, y) {
  const s = skyScale() || 1;
  return { vx: (x - W / 2) / s + 500, vy: (y - H / 2) / s + 400 };
}

/* ---------- 流星 ---------- */
const meteors = [];
let nextMeteor = performance.now() + 1500;
let showerUntil = 0;

function spawnMeteor() {
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? rand(-80, W * 0.4) : rand(W * 0.6, W + 80);
  const y = rand(-60, H * 0.35);
  const ang = rand(Math.PI * 0.18, Math.PI * 0.34) + (fromLeft ? 0 : Math.PI * 0.5);
  const sp = rand(7, 13);
  meteors.push({
    x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
    life: 1, decay: rand(0.006, 0.012), len: rand(70, 150),
  });
}

/* ---------- 超新星爆发粒子 ---------- */
const bursts = [];
function supernova(x, y, color) {
  const n = 26;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand(-0.2, 0.2);
    const sp = rand(1.2, 4.5);
    bursts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: rand(0.008, 0.02), r: rand(1, 2.4), c: color });
  }
  bursts.push({ x, y, vx: 0, vy: 0, life: 1, decay: 0.03, r: 3, c: "#ffffff", flash: true });
}

/* ---------- 五声音阶 & 环境音 ---------- */
let audioCtx = null, masterGain = null, padNodes = [], soundOn = false;
const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 784.0];

function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0;
  masterGain.connect(audioCtx.destination);
  startPad();
}

function startPad() {
  // 极轻的持续和弦垫：Cmaj9，双振荡器微失谐 + 低通 + 缓慢呼吸
  const freqs = [130.81, 164.81, 196.0, 246.94];
  const padGain = audioCtx.createGain();
  padGain.gain.value = 0.05;
  const lp = audioCtx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 620; lp.Q.value = 0.4;
  padGain.connect(lp); lp.connect(masterGain);
  freqs.forEach(f => {
    [-4, 4].forEach(det => {
      const o = audioCtx.createOscillator();
      o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det;
      o.connect(padGain); o.start();
      padNodes.push(o);
    });
  });
  const lfo = audioCtx.createOscillator(), lfoG = audioCtx.createGain();
  lfo.frequency.value = 0.06; lfoG.gain.value = 0.025;
  lfo.connect(lfoG); lfoG.connect(padGain.gain); lfo.start();
  padNodes.push(lfo);
}

function pluck(freq, vel) {
  if (!audioCtx || !soundOn) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "sine"; o.frequency.value = freq;
  const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
  o2.type = "triangle"; o2.frequency.value = freq * 2;
  g2.gain.value = 0.25;
  o2.connect(g2); g2.connect(g);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.28 * vel, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
  o.connect(g); g.connect(masterGain);
  o.start(t); o2.start(t); o.stop(t + 2.4); o2.stop(t + 2.4);
}

const soundBtn = document.getElementById("soundBtn");
soundBtn.addEventListener("click", () => {
  ensureAudio();
  soundOn = !soundOn;
  soundBtn.classList.toggle("on", soundOn);
  if (audioCtx.state === "suspended") audioCtx.resume();
  const t = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(t);
  masterGain.gain.linearRampToValueAtTime(soundOn ? 0.9 : 0.0, t + 1.2);
});

/* 页面切到后台时挂起音频上下文，回前台再恢复 */
document.addEventListener("visibilitychange", () => {
  if (!audioCtx) return;
  if (document.hidden) audioCtx.suspend();
  else if (soundOn) audioCtx.resume();
});

/* ---------- 许愿 ---------- */
/* 许愿星持久化：localStorage 安全读写（隐私模式降级为不保存） */
const store = {
  load() {
    try { return JSON.parse(localStorage.getItem("nocturne.wishes")) || []; }
    catch { return []; }
  },
  save(arr) {
    try { localStorage.setItem("nocturne.wishes", JSON.stringify(arr)); } catch {}
  },
};
/* wishStars: 虚拟天球坐标 {vx, vy}，每 7 颗连线成一个属于用户自己的星座 */
let wishStars = store.load().filter(p => typeof p.vx === "number" && p.vx >= 0 && p.vx <= 1000 && p.vy >= 0 && p.vy <= 800);

let wishes = wishStars.length;
const wishCountEl = document.getElementById("wishCount");
wishCountEl.textContent = wishes;
const toastEl = document.getElementById("toast");
let toastTimer = null;

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 3200);
}

const MILESTONES = { 1: "第一颗愿望已升空", 7: "七愿连成星座，它只属于你 ✦", 20: "二十颗星辰，皆你所愿", 50: "半百星辰，皆你所愿", 100: "百愿之夜，心想事成" };

function makeWish(x, y, starM) {
  wishes++;
  wishCountEl.textContent = wishes;
  /* 记录到天上（虚拟坐标），明晚打开还在 */
  const v = unproject(x, y);
  v.vx = Math.max(10, Math.min(990, v.vx));
  v.vy = Math.max(10, Math.min(790, v.vy));
  wishStars.push(v);
  store.save(wishStars);
  const noteIdx = Math.min(PENTA.length - 1, Math.round((starM / 1.8) * (PENTA.length - 1)));
  pluck(PENTA[noteIdx], rand(0.7, 1.0));
  if (wishes % 7 === 0) {
    showToast(`你的第 ${wishes / 7} 个星座诞生了 ✦`);
  } else if (MILESTONES[wishes]) {
    showToast(MILESTONES[wishes]);
  }
  supernova(x, y, "#ffe9b8");
}

/* ---------- 悬停星座 ---------- */
const tooltip = document.getElementById("tooltip");
let hovered = null; // { ci, si }

function findHover(mx, my) {
  for (let ci = 0; ci < CONSTELLATIONS.length; ci++) {
    const c = CONSTELLATIONS[ci];
    for (let si = 0; si < c.stars.length; si++) {
      const p = project(c.stars[si].x, c.stars[si].y, 1);
      const d = Math.hypot(mx - p.x, my - p.y);
      if (d < 16) return { ci, si, p };
    }
  }
  return null;
}

window.addEventListener("click", e => {
  if (e.target.closest && e.target.closest("button")) return;
  const pos = toLayout(e.clientX, e.clientY);
  const h = findHover(pos.x, pos.y);
  if (h) {
    makeWish(h.p.x, h.p.y, CONSTELLATIONS[h.ci].stars[h.si].m);
  } else {
    makeWish(pos.x, pos.y, rand(0.6, 1.4));
  }
});

/* ---------- 流星雨开关 ---------- */
const showerBtn = document.getElementById("showerBtn");
showerBtn.addEventListener("click", () => {
  showerUntil = performance.now() + 8000;
  for (let i = 0; i < 6; i++) spawnMeteor();
  showToast("流星雨为你而至 ✦");
  showerBtn.disabled = true;
  setTimeout(() => { showerBtn.disabled = false; }, 8000);
});

/* ---------- 时钟 ---------- */
const clockEl = document.getElementById("clock");
function tickClock() {
  const d = new Date();
  clockEl.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(v => String(v).padStart(2, "0")).join(":");
}
setInterval(tickClock, 1000); tickClock();

/* ---------- 主循环 ---------- */
/* 光晕精灵图集：每帧几十个 createRadialGradient 是主要 CPU 开销，
   改为按颜色预渲染到离屏 canvas，绘制时 drawImage 复用 */
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
const glowCache = new Map();
function glowSprite(color) {
  let sp = glowCache.get(color);
  if (sp) return sp;
  const S = 64;
  sp = document.createElement("canvas");
  sp.width = sp.height = S;
  const o = sp.getContext("2d");
  const g = o.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, hexToRgba(color, 1));
  g.addColorStop(0.28, hexToRgba(color, 0.5));
  g.addColorStop(1, hexToRgba(color, 0));
  o.fillStyle = g;
  o.fillRect(0, 0, S, S);
  glowCache.set(color, sp);
  return sp;
}

function drawStar(x, y, r, color, alpha, glow) {
  ctx.globalAlpha = alpha;
  if (glow) {
    const R = r * 5;
    ctx.drawImage(glowSprite(color), x - R, y - R, R * 2, R * 2);
  }
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  /* 锐利星核：放大后仍保持清晰的光点 */
  ctx.globalAlpha = Math.min(1, alpha + 0.25);
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(x, y, Math.max(r * 0.42, 0.7), 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  drift += dt * 0.001;

  /* 夜空底色：缓慢呼吸的蓝紫渐变 */
  const breath = Math.sin(drift * 0.13) * 0.5 + 0.5;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgb(${5 + breath * 4}, ${7 + breath * 3}, ${22 + breath * 6})`);
  grad.addColorStop(0.6, "#070a1c");
  grad.addColorStop(1, "#0d0a1e");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  /* 银河带（在背景星野之下） */
  drawMilkyWay();

  /* 背景星野 */
  for (const s of bgStars) {
    const p = project(s.x, s.y, s.layer);
    if (p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) continue;
    const tw = 0.45 + 0.55 * (Math.sin(drift * s.tw + s.ph) * 0.5 + 0.5);
    drawStar(p.x, p.y, s.r, s.c, tw * (0.4 + s.layer * 0.6), s.r > 1.6 && tw > 0.85);
  }

  /* 星座 */
  hovered = findHover(mouse.x, mouse.y);
  if (!hovered && pinHover && performance.now() < pinUntil) hovered = pinHover;
  for (let ci = 0; ci < CONSTELLATIONS.length; ci++) {
    const c = CONSTELLATIONS[ci];
    const hot = hovered && hovered.ci === ci;
    // 连线
    ctx.lineWidth = hot ? 1.6 : 1;
    ctx.strokeStyle = hot ? "rgba(190, 208, 255, 0.85)" : "rgba(140, 165, 255, 0.28)";
    ctx.beginPath();
    for (const [a, b] of c.lines) {
      const pa = project(c.stars[a].x, c.stars[a].y, 1);
      const pb = project(c.stars[b].x, c.stars[b].y, 1);
      ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
    }
    ctx.stroke();
    // 星点
    for (let si = 0; si < c.stars.length; si++) {
      const s = c.stars[si];
      const p = project(s.x, s.y, 1);
      const tw = 0.75 + 0.25 * Math.sin(drift * 1.4 + si * 1.7 + ci);
      drawStar(p.x, p.y, s.m * (hot ? 1.35 : 1), s.c, tw, true);
      if (hot) {
        ctx.strokeStyle = "rgba(255, 233, 184, 0.5)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, 10 + Math.sin(drift * 3) * 2, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  /* 许愿星：金色，缓慢脉动；每 7 颗连成一座属于用户的星座 */
  if (wishStars.length) {
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255, 217, 138, 0.35)";
    ctx.beginPath();
    for (let i = 1; i < wishStars.length; i++) {
      if (i % 7 === 0) continue; // 每座用户星座从新的星开始
      const a = project(wishStars[i - 1].vx, wishStars[i - 1].vy, 1);
      const b = project(wishStars[i].vx, wishStars[i].vy, 1);
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
    for (let i = 0; i < wishStars.length; i++) {
      const p = project(wishStars[i].vx, wishStars[i].vy, 1);
      const pulse = 0.7 + 0.3 * Math.sin(drift * 2 + i * 0.9);
      drawStar(p.x, p.y, 1.3, "#ffd98a", pulse, true);
    }
  }

  /* 流星 */
  if (now > nextMeteor) { spawnMeteor(); nextMeteor = now + (now < showerUntil ? rand(120, 420) : rand(2200, 6500)); }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx; m.y += m.vy; m.life -= m.decay;
    if (m.life <= 0 || m.x > W + 200 || m.y > H + 200) { meteors.splice(i, 1); continue; }
    const tail = { x: m.x - m.vx * (m.len / 10), y: m.y - m.vy * (m.len / 10) };
    const g = ctx.createLinearGradient(m.x, m.y, tail.x, tail.y);
    g.addColorStop(0, `rgba(255, 250, 235, ${0.9 * m.life})`);
    g.addColorStop(1, "rgba(255, 250, 235, 0)");
    ctx.strokeStyle = g; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tail.x, tail.y); ctx.stroke();
  }

  /* 超新星粒子 */
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.x += b.vx; b.y += b.vy;
    b.vx *= 0.965; b.vy *= 0.965;
    b.life -= b.decay;
    if (b.life <= 0) { bursts.splice(i, 1); continue; }
    if (b.flash) {
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 40 * (1 - b.life) + 8);
      g.addColorStop(0, `rgba(255,255,255,${b.life * 0.9})`);
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, 50, 0, Math.PI * 2); ctx.fill();
    } else {
      drawStar(b.x, b.y, b.r * b.life, b.c, b.life);
    }
  }

  /* 提示框 */
  if (hovered) {
    const c = CONSTELLATIONS[hovered.ci], s = c.stars[hovered.si];
    tooltip.querySelector(".t-name").innerHTML = `${c.name}<span>${c.latin.toUpperCase()}</span>`;
    tooltip.querySelector(".t-star").textContent = s.n;
    tooltip.querySelector(".t-lore").textContent = c.lore;
    tooltip.style.left = Math.min(W - 300, hovered.p.x + 18 - (window.visualViewport ? window.visualViewport.offsetLeft : 0)) + "px";
    tooltip.style.top = Math.min(H - 120, hovered.p.y + 18 - (window.visualViewport ? window.visualViewport.offsetTop : 0)) + "px";
    tooltip.classList.add("on");
    canvas.style.cursor = "pointer";
  } else {
    tooltip.classList.remove("on");
    canvas.style.cursor = "crosshair";
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
